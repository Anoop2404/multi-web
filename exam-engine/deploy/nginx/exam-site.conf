# /etc/nginx/sites-available/exam-site.conf -- Stage A-lite: engine + nginx on ONE droplet, no LB.
#   Cloudflare (proxied, SSL Full strict) -> nginx :443 (Cloudflare Origin cert) -> engine 127.0.0.1:8090
# engine.env on this droplet: EXAM_ENGINE_ADDR=127.0.0.1:8090 and EXAM_ENGINE_TRUST_PROXY=true.
# ops.env: LB_KIND=nginx. Moving to Stage B (more nodes) needs the DigitalOcean LB (lb/README.md).
#
# Install (Ubuntu 24.04, nginx 1.24):
#   sudo apt-get install -y nginx
#   sudo install -d -m 0750 /etc/ssl/cloudflare
#   sudo install -m 0644 origin.pem /etc/ssl/cloudflare/exam-origin.pem
#   sudo install -m 0600 origin.key /etc/ssl/cloudflare/exam-origin.key
#   sudo cp cloudflare-realip.conf /etc/nginx/snippets/cloudflare-realip.conf
#   sudo cp exam-site.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/exam-site.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Main context of /etc/nginx/nginx.conf (outside this file) for ~30k connections:
#   worker_processes auto;
#   worker_rlimit_nofile 200000;
#   events { worker_connections 32768; multi_accept on; }
# and in the nginx unit: `sudo systemctl edit nginx` -> [Service] LimitNOFILE=200000
#
# Replace exam.example.org and 203.0.113.10 (aaPanel server public IP) below.

upstream exam_engine {
    server 127.0.0.1:8090 max_fails=0;
    # Large pool of idle keepalive connections to the engine (no per-request TCP handshakes).
    keepalive 1024;
    keepalive_requests 100000;
    keepalive_timeout 75s;
}

# Per-client-IP limits ($binary_remote_addr is the student IP after real_ip). Generous on purpose:
# school labs share a NAT IP and mobile carriers use CGNAT. They stop floods; the engine's own
# limits (per session / identity, login lockout, bounded bcrypt queue) protect the exam.
limit_req_zone $binary_remote_addr zone=exam_login:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=exam_api:50m rate=500r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=exam_conn:20m;

log_format exam_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method",'
    '"u":"$uri","s":$status,"rt":$request_time,"urt":"$upstream_response_time","b":$body_bytes_sent,'
    '"ray":"$http_cf_ray"}';

server {
    listen 80;
    listen [::]:80;
    server_name exam.example.org;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    location = /health { proxy_pass http://exam_engine; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exam.example.org;

    ssl_certificate     /etc/ssl/cloudflare/exam-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/exam-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EXAMSSL:50m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # Optional Cloudflare Authenticated Origin Pulls (rejects anything that is not Cloudflare):
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/exam-access.log exam_json buffer=64k flush=5s;
    error_log  /var/log/nginx/exam-error.log warn;

    # Large keepalive towards Cloudflare's edge.
    keepalive_timeout 75s;
    keepalive_requests 10000;

    # Contract: 64 KB request body limit.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    limit_conn exam_conn 2000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # One clean value: the student IP (real_ip already resolved CF-Connecting-IP).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    # Never replay a POST on another attempt (sync/submit carry revisions; the client retries).
    proxy_next_upstream off;

    # Prometheus scrapes 127.0.0.1:8090/metrics / the VPC IP directly; never through the public site.
    location = /metrics { return 404; }

    # Internal API: Laravel (aaPanel server) only. The engine also requires the bearer token.
    location /internal/ {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://exam_engine;
    }

    # Login may wait up to 20 s for a bcrypt slot (then 503 busy with Retry-After).
    location = /api/login {
        limit_req zone=exam_login burst=200 nodelay;
        proxy_read_timeout 40s;
        proxy_pass http://exam_engine;
    }

    # Encrypted paper bundles: immutable, cached by Cloudflare (cache rule) -- no API limit.
    location /api/bundle/ {
        proxy_pass http://exam_engine;
    }

    location /api/ {
        limit_req zone=exam_api burst=2000 nodelay;
        proxy_pass http://exam_engine;
    }

    # Client app (index.html, /assets/*): served by the engine from EXAM_ENGINE_STATIC_DIR.
    location / {
        proxy_pass http://exam_engine;
    }
}
