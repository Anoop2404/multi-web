# /etc/haproxy/conf.d/00-exam.cfg -- HAProxy 2.8 (Ubuntu 24.04) in front of the exam engines.
# Alternative to the DigitalOcean LB (see ../README.md). The engines backend lives in
# /etc/haproxy/conf.d/50-engines.cfg, generated by scripts/haproxy-sync-backends.sh.
# Service: echo 'CONFIG="/etc/haproxy/conf.d"' >> /etc/default/haproxy   (loads every *.cfg in order)
#
# Files this config reads:
#   /etc/haproxy/certs/exam-origin.pem   Cloudflare Origin certificate + private key, concatenated (0600)
#   /etc/haproxy/cloudflare-ips.lst      Cloudflare ranges (lb/haproxy/cloudflare-ips.lst)
#   /etc/haproxy/trusted-ips.lst         non-Cloudflare clients allowed in (load generators)
#   /etc/haproxy/internal-ips.lst        clients allowed to call /internal/* (aaPanel server)

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    # ~30k client connections per engine node; leave room for the backend side.
    maxconn 120000
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.cachesize 200000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    option redispatch
    retries 2
    timeout connect 3s
    # Login can wait up to 20 s for a bcrypt slot; everything else is short.
    timeout client 65s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 65s
    timeout queue 20s
    timeout check 5s
    maxconn 100000

# Per-client-IP request-rate tables (keys are the real student IP, not Cloudflare's).
backend st_login
    stick-table type ipv6 size 1m expire 10m store http_req_rate(10s)

backend st_api
    stick-table type ipv6 size 2m expire 10m store http_req_rate(10s)

frontend exam
    bind :80
    bind :::443 v4v6 ssl crt /etc/haproxy/certs/exam-origin.pem alpn h2,http/1.1
    # Optional Cloudflare Authenticated Origin Pulls: append to the 443 bind line
    #   verify required ca-file /etc/haproxy/certs/cloudflare-origin-pull-ca.pem

    # Only Cloudflare (and explicitly trusted IPs) may connect: nobody bypasses the WAF.
    acl from_cloudflare src -f /etc/haproxy/cloudflare-ips.lst
    acl from_trusted    src -f /etc/haproxy/trusted-ips.lst
    http-request deny deny_status 403 unless from_cloudflare or from_trusted
    http-request redirect scheme https code 301 unless { ssl_fc }

    # Real client IP: CF-Connecting-IP when the peer is Cloudflare, else the TCP peer.
    # The engine trusts X-Forwarded-For (EXAM_ENGINE_TRUST_PROXY=true), so overwrite it with one value.
    http-request set-var(txn.client_ip) req.hdr_ip(CF-Connecting-IP) if from_cloudflare { req.hdr(CF-Connecting-IP) -m found }
    http-request set-var(txn.client_ip) src unless { var(txn.client_ip) -m found }
    http-request set-header X-Forwarded-For %[var(txn.client_ip)]
    http-request set-header X-Real-IP %[var(txn.client_ip)]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    acl internal_client var(txn.client_ip) -m ip -f /etc/haproxy/internal-ips.lst
    acl is_internal path_beg /internal/
    acl is_metrics  path /metrics
    acl is_login    path /api/login
    acl is_api      path_beg /api/
    acl is_bundle   path_beg /api/bundle/

    # Prometheus scrapes engines directly on the VPC; never expose /metrics publicly.
    http-request return status 404 content-type application/json string '{"error":"not_found","message":"Not found"}' if is_metrics
    # The internal API is for Laravel only (it also needs the bearer token).
    http-request return status 403 content-type application/json string '{"error":"forbidden","message":"Forbidden"}' if is_internal !internal_client

    # 64 KB request body limit (contract: 64 KB). Larger declared bodies never reach the engine.
    http-request return status 413 content-type application/json string '{"error":"invalid","message":"Request too large"}' if { req.hdr_val(content-length) gt 65536 }

    # Per-IP rate limits. Deliberately generous: whole school labs share one NAT IP and mobile
    # carriers (CGNAT) put thousands of students behind a few IPs. The engine's own limits
    # (per session / per identity, login lockout, bounded bcrypt queue) are the real protection;
    # these only stop floods. Calibrate with the load test.
    http-request track-sc1 var(txn.client_ip) table st_login if is_login
    http-request track-sc2 var(txn.client_ip) table st_api if is_api !is_bundle
    http-request return status 429 content-type application/json string '{"error":"rate_limited","message":"Too many requests. Please wait a few seconds and try again."}' hdr Retry-After 10 if is_login { sc_http_req_rate(1) gt 100 }
    http-request return status 429 content-type application/json string '{"error":"rate_limited","message":"Too many requests. Please wait a few seconds and try again."}' hdr Retry-After 10 if is_api !is_bundle { sc_http_req_rate(2) gt 5000 }

    default_backend engines

# HAProxy stats + Prometheus metrics for the monitor node (VPC only).
frontend stats
    bind :8404
    acl vpc src 10.0.0.0/8 127.0.0.0/8
    http-request deny unless vpc
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 10s
