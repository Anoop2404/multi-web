; Laravel consumer for exam-engine events (CONTRACT section 6), on the aaPanel production server.
; Claims events from the engine's internal API (POST /internal/events/claim), grades and writes them
; to the tenant databases, then acks. Each process has a stable consumer name
; (exam-engine-consumer_00, _01, ...) so after a restart it first re-claims its own pending events.
;
; Install (aaPanel): App Store -> Supervisor -> Add daemon, using the values below; or copy this file to
;   /www/server/panel/plugin/supervisor/profile/exam-engine-consumer.ini
; then:  supervisorctl reread && supervisorctl update && supervisorctl status exam-engine-consumer:*
;
; Scale: numprocs 2 normally; raise to 4-8 when booked concurrency exceeds 10k (plan section 6),
; then `supervisorctl reread && supervisorctl update`. More processes are safe: each claims its own batch.
;
; Deploys: the consumer keeps old code in memory -> `supervisorctl restart exam-engine-consumer:*` after
; every Laravel deploy (outside the exam freeze). stopwaitsecs lets the current batch finish and ack.
;
; If `php` is not on supervisord's PATH, use the full path from the sahodaya-worker profile
; (e.g. /www/server/php/83/bin/php).

[program:exam-engine-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php artisan exam-engine:consume --consumer=%(program_name)s_%(process_num)02d
directory=/www/wwwroot/sahodaya.truecampus.in
user=www
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
priority=990
redirect_stderr=true
stdout_logfile=/www/wwwroot/sahodaya.truecampus.in/storage/logs/exam-engine-consumer.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
