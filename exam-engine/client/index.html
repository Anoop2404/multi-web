<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#1d4ed8" />
        <meta name="robots" content="noindex" />
        <meta name="referrer" content="same-origin" />
        <meta name="format-detection" content="telephone=no" />
        <title>Online exam</title>
        <link rel="icon" href="data:," />
        <style>
            /* Shown only if the app never starts (very old browser or blocked script). */
            .boot-fallback {
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                max-width: 480px;
                margin: 18vh auto 0;
                padding: 0 16px;
                color: #334155;
                text-align: center;
            }
            .boot-fallback .late {
                opacity: 0;
                animation: boot-show 0.3s ease 10s forwards;
            }
            @keyframes boot-show {
                to {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="boot-fallback">
                <p>Loading the exam…</p>
                <p class="late">
                    Still loading? Check your internet connection and reload the page. If this keeps happening, update your browser (Chrome,
                    Safari, Edge or Firefox) or use another device.
                </p>
            </div>
        </div>
        <noscript><p style="text-align: center">Please turn on JavaScript to take the exam.</p></noscript>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
